<h4 class="subsection" id="Special-UUID-values-1"><span>41.21.3 Special UUID values<a class="copiable-link" href="#Special-UUID-values-1"> &para;</a></span></h4>
<a class="index-entry-id" id="index-special-uuid-values"></a>
<a class="index-entry-id" id="index-uuid-nil-and-uuid-max"></a>
<a class="index-entry-id" id="index-nil-uuid"></a>
<a class="index-entry-id" id="index-max-uuid"></a>

<p><code class="code">uuid-nil</code> and <code class="code">uuid-max</code> are constant values representing the
UUID equivalents of <code class="code">nil</code> and a max sentinel value, as defined in
RFC 9562.
